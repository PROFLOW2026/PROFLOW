<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P6 static specimen</title>
  <style>
    :root { --color-red-600: oklch(57.7% 0.245 27.325); --color-white: #fff; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: #f4f4f5;
      padding: 24px;
    }
  .text-red-600 { color: var(--color-red-600); }
    .bg-white { background-color: var(--color-white); }
    .nav-link { color: var(--color-red-600); }
    </style>
</head>
<body>
  <nav style="margin-bottom:16px;">
    <a href="#" class="nav-link" style="text-decoration:none;font-weight:600;">Nav link</a>
  </nav>
  <div class="bg-white card" style="padding:20px;border-radius:12px;border:1px solid #e4e4e7;max-width:360px;">
    <p class="text-red-600 sample-text" style="margin:0 0 12px;font-size:16px;">Sample destructive label text</p>
    <button type="button" class="bg-white text-red-600 sample-btn" style="padding:8px 16px;border-radius:8px;border:1px solid #e4e4e7;cursor:pointer;font-size:14px;">
      Action
    </button>
  </div>
</body>
</html>
