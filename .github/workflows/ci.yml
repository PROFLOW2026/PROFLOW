name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: Run UI tests (vitest ui project)
        required: false
        type: boolean
        default: false
      run_integration_tests:
        description: Run integration tests
        required: false
        type: boolean
        default: false
      run_playwright_smoke:
        description: Run Playwright release smoke
        required: false
        type: boolean
        default: false
      full_regression:
        description: Run full Playwright regression (43 tests)
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      migration: ${{ steps.filter.outputs.migration }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Migration-related paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            migration:
              - 'drizzle/**'
              - 'drizzle.config.*'
              - 'tests/integration/migration/**'
              - 'tests/integration/database/migrations.test.ts'
              - 'tests/unit/database/migration-journal.test.ts'

  quality:
    name: Fast gate · Lint · Typecheck · Unit · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Migration journal parity
        run: npm run db:check-journal

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key-for-ci
          APP_ENV: local
          LOG_LEVEL: warn

  ui-tests:
    name: UI tests (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui_tests == true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: UI tests
        run: npm run test:ui

  integration-tests:
    name: Integration tests (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration_tests == true
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Integration tests
        run: npm run test:integration

  migration:
    name: Migration hardening (DB changes only)
    needs: changes
    if: needs.changes.outputs.migration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Migration hardening (serial, 1 worker)
        run: npm run test:migration

  e2e-smoke:
    name: Playwright smoke (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_playwright_smoke == true
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projectflow_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projectflow_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Release smoke E2E
        run: npm run playwright:smoke
        env:
          CI: true
          APP_ENV: local
          E2E_DATABASE_MODE: postgres
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/projectflow_e2e
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: playwright-report
          retention-days: 7

  e2e-regression:
    name: Playwright full regression (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.full_regression == true
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Full Playwright regression
        run: npm run playwright:regression
        env:
          CI: true
          APP_ENV: local
          DATABASE_URL: postgres://postgres@127.0.0.1:55432/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-report
          path: playwright-report
          retention-days: 7
