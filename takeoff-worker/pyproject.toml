[project]
name = "projectflow-takeoff-worker"
version = "0.1.0"
description = "Stateless blueprint takeoff worker for ProjectFlow electrical BOQ"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
takeoff-worker = "takeoff_worker.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["takeoff_worker*"]
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["."]
